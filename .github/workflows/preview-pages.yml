# レビュー用の GitHub Pages 公開。
#
# 本番（Firebase App Hosting）とは別物。ここは公開側のデザインを見るためだけの経路で、
# 静的書き出しでしか動かない。
#
# /admin と /api は Server Actions を使っていて静的書き出しできないため、
# 書き出しの直前に取り除く。公開側は admin に一切依存していないので消しても通る
# （src/app/(site) と src/components/{home,layout,motion} からの import は無い）。
# リポジトリのソースには手を付けず、CI のワークスペース上でだけ消す。
name: preview-pages

on:
  push:
    # デザインのレビュー中は作業ブランチからも出す。
    # 方針が固まったら main だけに戻す。
    branches: [main, feat/comic-design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に別のデプロイが割り込まないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 静的書き出しできない部分を落とす。ここで消しているのは管理画面だけで、
      # 公開側のページには影響しない。
      - name: Drop server-only routes
        run: rm -rf src/app/admin src/app/api src/components/admin

      - name: Build (static export)
        env:
          STATIC_EXPORT: "1"
          # https://<user>.github.io/888-hp/ に置くのでサブパスを渡す
          NEXT_PUBLIC_BASE_PATH: /888-hp
          NEXT_PUBLIC_SITE_URL: https://nekoshinoneko.github.io/888-hp
          # レビュー用なので検索結果に出さない
          NEXT_PUBLIC_NOINDEX: "1"
        run: npm run build

      # _next/ で始まるディレクトリを Jekyll に消させない
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
